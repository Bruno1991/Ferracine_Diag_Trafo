name: Publicar Ferracine Diag Trafo no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ferracine_diag_trafo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        working-directory: ferracine_diag_trafo
        run: npm install --no-audit --no-fund

      - name: Gerar aplicacao
        working-directory: ferracine_diag_trafo
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ferracine_diag_trafo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
