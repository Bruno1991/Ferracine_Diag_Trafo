name: Publicar Ferracine Diag Trafo no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ferracine_diag_trafo/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Localizar aplicacao
        id: app
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ferracine_diag_trafo/package.json ]]; then
            echo "dir=ferracine_diag_trafo" >> "$GITHUB_OUTPUT"
          else
            echo "package.json nao encontrado" >&2
            exit 1
          fi

      - name: Instalar dependencias
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci --no-audit --no-fund

      - name: Validar tipos
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run lint

      - name: Executar testes diagnosticos
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm test

      - name: Gerar aplicacao
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.app.outputs.dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
